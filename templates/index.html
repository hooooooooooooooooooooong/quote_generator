<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오늘의 명언 / 운세</title>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
    max-width: 400px;
  }
  h1 { color: #764ba2; }
  #quote {
    font-size: 20px;
    margin: 20px 0;
    min-height: 80px;
    color: #333;
  }
  button {
    background: #764ba2;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #667eea; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔮 오늘의 명언 / 운세</h1>
    <p id="quote">버튼을 눌러 오늘의 메시지를 확인하세요!</p>
    <button onclick="getQuote()">운세 보기</button>
  </div>

  <script>
    async function getQuote() {
      const res = await fetch("/api/random");
      const data = await res.json();
      document.getElementById("quote").innerText = data.quote;
    }
  </script>
</body>
</html>
